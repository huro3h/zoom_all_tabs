<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      margin: 10px;
      background-color: #f5f5f5;
      width: 200px;
    }
    .section-title {
      font-size: 11px;
      color: #666;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    button {
      flex: 1;
      padding: 6px 0;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #ffffff;
      transition: all 0.15s ease;
      text-align: center;
    }
    button:hover {
      background-color: #4682B4;
      color: white;
      border-color: #4682B4;
    }
    hr {
      border: 0;
      border-top: 1px solid #ddd;
      margin: 10px 0;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .setting-row input[type="number"] {
      width: 50px;
      padding: 3px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: right;
    }
    #save-btn {
      width: 100%;
      background-color: #2e8b57;
      color: white;
      border-color: #2e8b57;
      font-size: 12px;
      padding: 5px 0;
      margin-top: 4px;
    }
    #save-btn:hover {
      background-color: #3cb371;
      border-color: #3cb371;
    }
  </style>
</head>
<body>
<div class="section-title">Fixed Zoom</div>
<div class="btn-row">
  <button id="zoom-90">90%</button>
  <button id="zoom-100">100%</button>
</div>
<div class="btn-row">
  <button id="zoom-110">110%</button>
  <button id="zoom-125">125%</button>
</div>

<hr>

<div class="section-title">Custom Zoom</div>
<div class="btn-row">
  <button id="custom-1">---</button>
  <button id="custom-2">---</button>
</div>

<hr>

<div class="section-title">Settings</div>
<div class="setting-row">
  <label for="input-c1">Custom 1:</label>
  <div><input type="number" id="input-c1" min="25" max="500"> %</div>
</div>
<div class="setting-row">
  <label for="input-c2">Custom 2:</label>
  <div><input type="number" id="input-c2" min="25" max="500"> %</div>
</div>

<button id="save-btn">Save Settings</button>

<script src="popup.js"></script>
</body>
</html>
